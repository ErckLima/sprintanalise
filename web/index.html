<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SprintAnalise</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>SprintAnalise</h1>
    <div id="week-banner" class="week-banner">Carregando...</div>
    <div class="topbar-actions">
      <button id="sync-btn" class="btn btn-primary">Atualizar agora</button>
      <div class="menu-dropdown">
        <button id="menu-toggle" type="button" class="btn btn-secondary">Menu ▾</button>
        <div id="menu-panel" class="menu-panel">
          <a class="menu-item" href="weeks.html">Resumo de semanas</a>
          <button id="discover-btn" type="button" class="menu-item">Buscar pessoas</button>
          <div class="menu-section">
            <span class="menu-section-label">Exige senha</span>
            <button id="start-week-btn" type="button" class="menu-item menu-item-danger">Iniciar a Semana</button>
            <button id="delete-week-btn" type="button" class="menu-item menu-item-danger" disabled>Excluir última semana</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="status-message" class="status-message"></div>

  <div class="filter-bar">
    <div class="hidden-people-dropdown">
      <button id="hidden-people-toggle" type="button" class="btn btn-secondary">
        <span id="hidden-people-summary">Mostrar pessoas</span>
      </button>
      <div id="hidden-people-panel" class="hidden-people-panel">
        <div id="hidden-people-list" class="hidden-people-list"></div>
      </div>
    </div>
  </div>

  <main id="people-list" class="people-grid">
    <p class="empty-state">Carregando...</p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
